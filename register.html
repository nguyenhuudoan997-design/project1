<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - Hệ thống Google Play</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #007bff; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; font-size: 14px; }
        .success { color: green; text-align: center; font-size: 14px; }
        .link-login { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-login a { color: #ff4b4b; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>📝 Đăng ký tài khoản</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Nhập tên đăng nhập mới" required>
            <input type="password" name="password" placeholder="Nhập mật khẩu mới" required>
            <button type="submit">Đăng ký</button>
        </form>
        <div class="link-login">
            Đã có tài khoản? <a href="/">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
