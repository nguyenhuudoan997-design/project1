<!-- ==========================================
     STATISTICS CARDS
========================================== -->

<div class="row g-4 mb-4">

    <!-- TOTAL PREDICTIONS -->
    <div class="col-xl-4 col-md-6">

        <div class="card dashboard-stat-card h-100 shadow-sm border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <p class="text-muted mb-1">
                            Tổng số dự đoán
                        </p>

                        <h2 class="fw-bold mb-0">
                            {{ total_prediction|default(0) }}
                        </h2>

                    </div>

                    <div class="stat-icon">
                        <i class="bi bi-stars"></i>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- AVERAGE RATING -->
    <div class="col-xl-4 col-md-6">

        <div class="card dashboard-stat-card h-100 shadow-sm border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <p class="text-muted mb-1">
                            Rating trung bình
                        </p>

                        <h2 class="fw-bold mb-0">

                            {{ "%.2f"|format(average_rating|default(0)) }}

                            <small class="text-muted fs-6">
                                / 5
                            </small>

                        </h2>

                    </div>

                    <div class="stat-icon">
                        <i class="bi bi-star-fill"></i>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ACCURACY -->
    <div class="col-xl-4 col-md-6">

        <div class="card dashboard-stat-card h-100 shadow-sm border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <p class="text-muted mb-1">
                            Độ chính xác
                        </p>

                        <h2 class="fw-bold mb-0">

                            {{ "%.2f"|format(accuracy|default(0)) }}%

                        </h2>

                    </div>

                    <div class="stat-icon">
                        <i class="bi bi-bullseye"></i>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
