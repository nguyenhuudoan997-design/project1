{% extends "layout.html" %}

{% block title %}
Analytics
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">
        <i class="bi bi-bar-chart-fill"></i>
        Analytics Dashboard
    </h2>

    <div class="row">

        <!-- Line Chart -->
        <div class="col-lg-8 mb-4">

            <div class="card shadow-sm">

                <div class="card-header">

                    Prediction Trend

                </div>

                <div class="card-body">

                    <canvas id="trendChart"></canvas>

                </div>

            </div>

        </div>

        <!-- Pie Chart -->
        <div class="col-lg-4 mb-4">

            <div class="card shadow-sm">

                <div class="card-header">

                    Rating Distribution

                </div>

                <div class="card-body">

                    <canvas id="ratingChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script>

const trendLabels = {{ trend_labels|tojson }};
const trendValues = {{ trend_values|tojson }};

const ratingLabels = {{ rating_labels|tojson }};
const ratingValues = {{ rating_values|tojson }};

//
// LINE CHART
//

new Chart(document.getElementById("trendChart"), {

    type: "line",

    data: {

        labels: trendLabels,

        datasets: [{

            label: "Prediction Rating",

            data: trendValues,

            borderWidth: 3,

            tension: 0.4,

            fill: true

        }]

    }

});

//
// PIE CHART
//

new Chart(document.getElementById("ratingChart"), {

    type: "pie",

    data: {

        labels: ratingLabels,

        datasets: [{

            data: ratingValues

        }]

    }

});

</script>

{% endblock %}
