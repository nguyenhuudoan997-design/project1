{% extends "layout.html" %}


{% block title %}
Phân tích dữ liệu
{% endblock %}


{% block content %}

<div class="container-fluid">

    <div class="d-flex align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-bar-chart-fill text-primary"></i>

                Phân tích dữ liệu

            </h2>

            <p class="text-muted mb-0">

                Thống kê các dự đoán của hệ thống AI Rating Predictor.

            </p>

        </div>

    </div>


    <div class="row">

        <!-- LINE -->

        <div class="col-lg-8 mb-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white">

                    <i class="bi bi-graph-up me-2"></i>

                    Xu hướng dự đoán

                </div>

                <div class="card-body">

                    <div style="height:350px;">

                        <canvas id="trendChart"></canvas>

                    </div>

                </div>

            </div>

        </div>


        <!-- PIE -->

        <div class="col-lg-4 mb-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white">

                    <i class="bi bi-pie-chart me-2"></i>

                    Phân bố Rating

                </div>

                <div class="card-body">

                    <div style="height:350px;">

                        <canvas id="ratingChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script>

const trendLabels = {{ trend_labels|tojson }};
const trendValues = {{ trend_values|tojson }};

const ratingLabels = {{ rating_labels|tojson }};
const ratingValues = {{ rating_values|tojson }};


console.log("Trend:", trendLabels);
console.log("Values:", trendValues);

console.log("Rating:", ratingLabels);
console.log("Values:", ratingValues);


/* ==============================
   LINE CHART
============================== */

const trendCanvas =
    document.getElementById("trendChart");

if (trendCanvas) {

    new Chart(
        trendCanvas,
        {

            type: "line",

            data: {

                labels: trendLabels,

                datasets: [

                    {

                        label: "Rating dự đoán",

                        data: trendValues,

                        borderWidth: 3,

                        tension: 0.4,

                        fill: false,

                        pointRadius: 5

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        min: 0,

                        max: 5,

                        ticks: {

                            stepSize: 0.5

                        },

                        title: {

                            display: true,

                            text: "Điểm Rating"

                        }

                    },

                    x: {

                        title: {

                            display: true,

                            text: "Lần dự đoán"

                        }

                    }

                }

            }

        }

    );

}


/* ==============================
   PIE CHART
============================== */

const ratingCanvas =
    document.getElementById("ratingChart");

if (ratingCanvas) {

    new Chart(
        ratingCanvas,
        {

            type: "pie",

            data: {

                labels: ratingLabels,

                datasets: [

                    {

                        data: ratingValues

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        position: "bottom"

                    }

                }

            }

        }

    );

}

</script>

{% endblock %}
